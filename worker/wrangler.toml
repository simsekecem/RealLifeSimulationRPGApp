name = "life-sim-worker"
main = "src/index.js"
compatibility_date = "2025-10-13"

preview_urls = true

[[d1_databases]]
binding = "DB"
database_name = "life_sim_db"
database_id = "1637853b-0eb9-4ec2-8bef-4da313b87320"

[vars]
SUPABASE_URL = "https://rzsndtstonztfuayodmg.supabase.co"
SUPABASE_PROJECT = "rzsndtstonztfuayodmg"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[triggers]
crons = [
  "10 2 * * *",   # 08:00 UTC+3 (Morning routine)
  "0 9 * * *",   # 12:00 UTC+3 (Lunch check-in)
  "0 13 * * *",  # 16:00 UTC+3 (Afternoon reminder)
  "0 20 * * *",  # 20:00 UTC+3 (Evening summary)
  "10 21 * * *"   # 00:00 UTC+3 (End of day review)
]

[ai]
binding = "AI"