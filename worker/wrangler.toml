name = "life-sim-worker"
main = "src/index.js"
compatibility_date = "2025-10-13"

preview_urls = true

[[d1_databases]]
binding = "DB"
database_name = "life_sim_db"
database_id = "1637853b-0eb9-4ec2-8bef-4da313b87320"

[vars]
SUPABASE_URL = "https://rzsndtstonztfuayodmg.supabase.co"
SUPABASE_PROJECT = "rzsndtstonztfuayodmg"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[triggers]
crons = [
  "10 2 * * *",   # TR 08:00 (Güne başla)
  "0 9 * * *",   # TR 12:00 (Öğle arası kontrolü)
  "0 13 * * *",  # TR 16:00 (İkindi darlaması)
  "0 17 * * *",  # TR 20:00 (Akşam raporu)
  "10 21 * * *"   # TR 00:00 (Günü bitirirken son çağrı)
]